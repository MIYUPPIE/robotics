repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy contracts storage biometric voice hand_ui kiosk_app registration_app admin_app
        language: system
        pass_filenames: false

      - id: gate-tests
        name: gate tests (pytest, deterministic subset)
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
