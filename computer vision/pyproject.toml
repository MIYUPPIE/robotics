[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voter-kiosk-cv"
version = "0.1.0"
description = "Prototype computer-vision biometric voter registration + gesture voting kiosk for Nigeria (not official election infrastructure)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "Pillow>=10.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]
eval = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = [
    "contracts*",
    "storage*",
    "biometric*",
    "voice*",
    "hand_ui*",
    "kiosk_app*",
    "registration_app*",
    "admin_app*",
    "scripts*",
]

[tool.pytest.ini_options]
testpaths = [
    "contracts",
    "storage",
    "biometric",
    "voice",
    "hand_ui",
    "kiosk_app",
    "registration_app",
    "admin_app",
    "scripts",
    "tests",
]
python_files = ["test_*.py"]
markers = [
    "eval: slow, real-model quality evals — excluded from gate-test runs, run via `make eval`",
]
addopts = "-m 'not eval' --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
